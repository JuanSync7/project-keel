# RAG knobs — copy to rag.local.toml and tune. NO secrets here (use .env).
# No loader ships: this file is a pattern for the one your app writes, and
# nothing in the template reads it.
[retrieval]
top_k = 8
reranker = "bge-reranker-v2-m3"   # adapter selected in models/config/
max_context_tokens = 8192

[embedding]
model = "text-embedding-3-large"  # adapter selected in models/config/
dimensions = 1024
batch_size = 64

[chunking]
chunk_tokens = 512
overlap_tokens = 64

[service]
host = "0.0.0.0"
port = 8000                        # read by the loader you write; none ships
request_timeout_s = 30
