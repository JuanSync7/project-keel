# copier.yml — interactive generation of a Project Keel skeleton.
#
# Keel's repo root IS the template: copier copies the real files verbatim and only
# renders files carrying the `.jinja` suffix, so keel stays a valid, self-gating
# working repo. Run:  copier copy gh:JuanSync7/project-keel <dest>   (or `make new`).
_subdirectory: "."
_answers_file: ".copier-answers.yml"
_templates_suffix: ".jinja"
# Fail with copier's own clear message rather than a mystery render error on an old
# copier. Generate a NAMED version, not a bare SHA:  copier copy --vcs-ref v0.1.0 ...
_min_copier_version: "9"
# Keel uses CLAUDE.md -> AGENT.md symlinks throughout (enforced by check_I); recreate
# them as symlinks in the generated project instead of dereferencing to regular files.
_preserve_symlinks: true

# Keel's own instance/meta files that must NOT be copied verbatim into a new
# project (their `.jinja` twins render the tailored versions; the generator's own
# meta-scripts and generated views don't belong in a downstream project).
_exclude:
  # A custom _exclude REPLACES copier's built-in defaults, so re-list them here.
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Keel instance/meta + generated views that must not ship into a new project.
  # NOTE: config/project.json, pyproject.toml and README.md are NOT excluded — each
  # has a .jinja twin that renders to the same path and (processed after the plain
  # file) overwrites it with the tailored version (name/requires-python/title). With
  # keel's own answers the twins reproduce keel's files byte-for-byte (self-parity).
  # NOTE: .copier-answers.yml is NOT excluded — copier WRITES it into the generated
  # project (it records the answers so `copier update` works); keel gitignores its own.
  # .gitignore.jinja is the one DIVERGENCE twin: unlike the twins above it deliberately
  # does NOT reproduce keel's file, because keel is the template and a generated project
  # is not — it drops the `.copier-answers.yml` ignore line so the answers file is
  # TRACKED downstream (without it, any clone/CI checkout loses `copier update`).
  # Pinned by tests/integration/test_copier_generation.py; do not "restore parity".
  - ".venv"
  - "wiki/corpus.json"
  - "wiki/llms.txt"
  - "wiki/llms-full.txt"
  - "wiki/.runtime"
  # Keel's own template META-tests. They generate FROM this repo and assert on
  # copier.yml and the .jinja twins — neither of which exists in a project generated
  # BY it. `.github/workflows/ci.yml` ships verbatim and installs the `template`
  # extra, so an un-pruned meta-test RUNS downstream and fails on keel-only files,
  # turning every descendant's CI red. The glob covers every test_copier_*.py.
  # Pinned by tests/integration/test_copier_generation.py.
  - "tests/integration/test_copier_*.py"
  # Answer-driven pruning: keep only the chosen frontend stack (the two reference
  # apps are self-contained under src/frontend/<stack>/, so pruning one is clean).
  - "{% if frontend_stack != 'react-vite' %}src/frontend/react-vite{% endif %}"
  - "{% if frontend_stack != 'astro' %}src/frontend/astro{% endif %}"
  - "{% if frontend_stack == 'none' %}src/frontend{% endif %}"
  # Transport pruning: api/grpc and api/edge_nginx are self-contained add-ons (no
  # code/test imports them), so drop each unless it was selected. REST (api/rest_fastapi)
  # and MCP (mcp/) are NOT pruned — the bundled showcase, AAD reference impl, frontend
  # and CI run on them; removing them is a separate "no-showcase" mode, out of scope here.
  - "{% if 'grpc' not in transports %}api/grpc{% endif %}"
  - "{% if 'edge_nginx' not in transports %}api/edge_nginx{% endif %}"

# ---- Q&A (core facts; map 1:1 to config/project.json, enforced by check_H) -----
project_name:
  type: str
  help: "Project name (config/project.json name; also used in docs/pyproject)"
  default: "my_project"

# Computed (not asked): identifier + display forms derived from project_name so a
# free-text name ("Acme Widgets") yields a PEP 508-valid package slug ("acme_widgets")
# and a title-cased heading ("Acme Widgets"). Keel's own answer (project_keel) round-
# trips: slug -> "project_keel", title -> "Project Keel" (the self-parity anchor).
project_slug:
  type: str
  when: false
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

project_title:
  type: str
  when: false
  default: "{{ project_name | replace('_', ' ') | replace('-', ' ') | title }}"

frontend_stack:
  type: str
  help: "Frontend stack to keep (or 'none' for a backend-only project)"
  choices:
    - react-vite
    - astro
    - none
  default: react-vite

backend_python:
  type: str
  help: "Minimum Python for the backend (must match pyproject requires-python)"
  default: ">=3.10"

transports:
  type: str
  multiselect: true
  help: "Optional add-on transports to keep (REST + MCP always ship — they back the bundled showcase & AAD reference implementation, and their dirs/tests can't be cleanly removed)"
  choices:
    - grpc
    - edge_nginx
  default: []

profiles:
  type: str
  multiselect: true
  help: "Domain coding-practice profiles to enable (ai / cuda / langgraph)"
  choices:
    - ai
    - cuda
    - langgraph
  default: []
