# copier.yml — interactive generation of a Project Keel skeleton.
#
# Keel's repo root IS the template: copier copies the real files verbatim and only
# renders files carrying the `.jinja` suffix, so keel stays a valid, self-gating
# working repo. Run:  copier copy --trust gh:JuanSync7/project-keel <dest>   (or `make new`).
_subdirectory: "."
_answers_file: ".copier-answers.yml"
_templates_suffix: ".jinja"
# Fail with copier's own clear message rather than a mystery render error on an old
# copier. This is the floor of the NEWEST feature used below, and it has moved twice
# for the same reason — a floor that admits a copier which then crashes is worse than
# no floor, because the user is told the version was checked:
#   9.1.0  `multiselect:` (transports/profiles); 9.0.1 dies on `Could not convert [] to string`
#   9.3.0  the `command:`/`when:` `_migrations` form; 9.2.0 dies on KeyError: 'version',
#          because its migration_tasks reads migration["version"] with no guard;
#          the list-form `_tasks` and `{{ _copier_python }}` below are older than it.
#          `_copier_operation` is NOT used: it is newer than this floor.
# Raise it whenever a newer feature is used;
# tests/integration/test_copier_generator_contract.py pins the two together.
# Generate a NAMED version, not a bare SHA:  copier copy --trust --vcs-ref v0.3.0 ...
_min_copier_version: "9.3.0"
# Keel uses CLAUDE.md -> AGENT.md symlinks throughout (enforced by check_I); recreate
# them as symlinks in the generated project instead of dereferencing to regular files.
_preserve_symlinks: true
# A generated project's documents must be fresh on arrival: the template's
# `updated:` stamps are the dates keel last touched them, so a project committed
# the day it was generated had every governed document stale against its own
# first commit (112 of 112, measured). The task stamps them with the generation
# date — SOURCE_DATE_EPOCH in UTC when set, so a pinned build is reproducible.
# No mode flag, on purpose: the writer stamps only what git would commit
# (untracked, changed against HEAD, committed stale), so the same command is
# right in a bare directory, in a repository that already has history (an
# arriving document is untracked; a flag that skipped such trees left 105 of
# 113 documents stale, measured), and in every render `copier update` makes —
# the scratch copies of the old and new template AND the real project — so the
# stamp lines of the three agree and the update's patch applies (a task that
# stamped only the scratch copies left one `.rej` per document under
# `--conflict rej`, measured). A list, not a string, so no shell is involved;
# `_copier_python` is the interpreter copier itself runs under, so no
# virtualenv is needed yet.
# THE COST: tasks make keel an unsafe template, so `copier copy` needs `--trust`
# as `copier update` already did (docs/adr/keel/K-0010-generation-needs-trust-to-stamp-docs.md).
_tasks:
  - ["{{ _copier_python }}", "scripts/jobs/restamp_docs.py", "--quiet"]

# Keel's own instance/meta files that must NOT be copied verbatim into a new
# project (their `.jinja` twins render the tailored versions; the generator's own
# meta-scripts and generated views don't belong in a downstream project).
# Every entry needs a row in docs/guides/generate-and-upgrade.md's exclusion table
# whose Why cell says why a project goes without it, and must leave out a file
# copier can see under some answer set or be spelled by a .gitignore line (a
# leading or trailing `/` aside; a glob that only covers it does not count); a row
# that names no entry here is a reason for a file that in fact ships. Copier's
# own defaults, re-listed below, need only the row.
# tests/integration/test_copier_shipping.py holds all of it.
_exclude:
  # A custom _exclude REPLACES copier's built-in defaults, so re-list them here.
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # Keel instance/meta + generated views that must not ship into a new project.
  # NOTE: config/project.json, pyproject.toml and README.md are NOT excluded — each
  # has a .jinja twin that renders to the same path with the tailored version
  # (name/requires-python/title). The plain file is NOT copied-then-overwritten: for
  # any path with a `<name>.jinja` sibling copier's `_render_path` returns early, so
  # the plain twin is never copied at all and the order files are walked in is
  # irrelevant. With keel's own answers these twins reproduce keel's files
  # byte-for-byte (self-parity).
  # NOTE: .copier-answers.yml is NOT excluded — copier WRITES it into the generated
  # project (it records the answers so `copier update` works); keel gitignores its own.
  # .gitignore.jinja is the one DIVERGENCE twin: unlike the twins above it deliberately
  # does NOT reproduce keel's file, because keel is the template and a generated project
  # is not — it drops the `.copier-answers.yml` ignore line so the answers file is
  # TRACKED downstream (without it, any clone/CI checkout loses `copier update`).
  # Pinned by tests/integration/test_copier_generation.py; do not "restore parity".
  - ".venv"
  # Keel's own in-flight scratch (handoff notes for a branch in progress). It is
  # about THIS repo's unfinished work and would be meaningless — and misleading —
  # in a project generated from it. Anchored at the root, as .gitignore's `/tmp/`
  # is: a bare `tmp` would also leave out a `tmp` directory deeper in the tree.
  - "/tmp"
  # Same rule, for prose that is not scratch: the hardening plan is keel's worklist
  # — passes, measurements and deferrals about THIS repo, `status: draft`. Shipped
  # verbatim it lands as a new project's design document. The FILE only: the
  # directory's labeled README.md is the placeholder a project writes into, and
  # pruning it would red the project's own check_B.
  - "docs/design/keel-hardening-plan.md"
  - "docs/design/documentation-quality.md"
  - "docs/design/downstream-feedback.md"
  - "docs/design/make-next-steps.md"
  # Keel's own run records: one file per unattended run of THIS repo, naming its
  # campaigns and slices. A generated project declares none of them, so a shipped
  # record reds its own `make check`. The whole directory: it holds no README.md.
  - "docs/design/runs"
  - "wiki/corpus.json"
  - "wiki/llms.txt"
  - "wiki/llms-full.txt"
  - "wiki/.runtime"
  # Same rule, one more generated view: openapi.json is exported FROM the live app.
  # Keel's copy names keel and lists the showcase routes, so shipping it verbatim
  # makes `make check-openapi` stale — red on arrival — in any project with a
  # different name or without the showcase. `export_openapi.py --check` treats a
  # missing file as "no contract published yet" and tells the user how to publish
  # one. Pinned by tests/integration/test_copier_generation.py.
  - "api/rest_fastapi/openapi.json"
  # Keel's own template META-tests. They generate FROM this repo and assert on
  # copier.yml and the .jinja twins — neither of which exists in a project generated
  # BY it. `.github/workflows/ci.yml` ships verbatim and installs the `template`
  # extra, so an un-pruned meta-test RUNS downstream and fails on keel-only files,
  # turning every descendant's CI red. The glob covers every test_copier_*.py.
  # Pinned by tests/integration/test_copier_generation.py.
  - "tests/integration/test_copier_*.py"
  # The render cache serves only test_copier_generation.py, pruned above, so
  # downstream it would be a helper with no caller. Never shipped, so no
  # `_migrations` removal.
  - "tests/render_cache.py"
  - "tests/unit/test_render_cache.py"
  # The downstream audit is keel-only: it imports THIS checkout's check_structure
  # API (run_checks, CHECKS, JSON_CONFIGS), so a copy shipped into a project would
  # pair an older doer with a newer template's gates. A generated project keeps the
  # `make audit-project` stub, which names the template checkout to run it from.
  # Decision: docs/design/downstream-feedback.md, CMP-1.S5. Never shipped, so no
  # `_migrations` removal. Its integration test is pruned by the glob above.
  - "scripts/audit_project.py"
  - "tests/unit/scripts/test_audit_project.py"
  # The release canary is keel-only for the same reason: it renders THIS checkout
  # and its answer sets name copier.yml questions, which a generated project does
  # not have. Its snapshot module serves only the canary and the audit, and its
  # workflow runs `make canary`, which a project answers with the stub. Never
  # shipped, so no `_migrations` removal.
  - "scripts/canary.py"
  - "scripts/template_snapshot.py"
  - "tests/unit/scripts/test_canary.py"
  - "tests/unit/scripts/test_template_snapshot.py"
  - "tests/integration/test_canary_wiring.py"
  - ".github/workflows/canary.yml"
  # Answer-driven pruning: keep only the chosen frontend stack (the two reference
  # apps are self-contained under src/frontend/<stack>/, so pruning one is clean).
  - "{% if frontend_stack != 'react-vite' %}src/frontend/react-vite{% endif %}"
  - "{% if frontend_stack != 'astro' %}src/frontend/astro{% endif %}"
  - "{% if frontend_stack == 'none' %}src/frontend{% endif %}"
  # ...and the workflow that BUILDS that stack. `pages.yml` names `src/frontend/astro`
  # literally (npm ci / npm run build / upload dist), and it ships verbatim like
  # `ci.yml` does — so under any other answer, including the DEFAULT one, its build job
  # ran `npm ci` in a directory the line above just pruned and reddened the first push
  # to main. Same class as the meta-tests: a shipped-verbatim file that only makes
  # sense for one answer. Pinned by tests/integration/test_copier_generation.py, which
  # scans every shipped Makefile/workflow/script for a pruned frontend path.
  - "{% if frontend_stack != 'astro' %}.github/workflows/pages.yml{% endif %}"
  # CI pipeline adapters: keep the one file per ci_pipeline answer, both for
  # `both`. Each runs config/project.json ci_pipeline.steps, which
  # tests/integration/test_ci_pipeline_gate.py holds it to, and
  # tests/integration/test_copier_generation.py holds every answer to keeping
  # exactly the chosen set, never none. The GitLab file is a `.jinja` twin, so
  # keel itself runs GitHub's alone.
  - "{% if ci_pipeline == 'gitlab' %}.github/workflows/ci.yml{% endif %}"
  - "{% if ci_pipeline == 'github' %}.gitlab-ci.yml{% endif %}"
  # Transport pruning: api/grpc and api/edge_nginx are self-contained add-ons (no
  # code imports them), so drop each unless it was selected. REST (api/rest_fastapi)
  # and MCP (mcp/) are NOT pruned: they are the always-shipped transport foundation —
  # the skeleton's own /things route, the AAD reference impl and the MCP servers all
  # live on them, and none of that depends on the showcase (see the `showcase` prunes
  # below and ADR-K-0007, which supersedes ADR-K-0004's claim that they are inseparable).
  - "{% if 'grpc' not in transports %}api/grpc{% endif %}"
  # The one test that loads api/grpc/server.py (by path, against fake grpc
  # modules) goes with it.
  - "{% if 'grpc' not in transports %}tests/unit/api/test_grpc_server.py{% endif %}"
  - "{% if 'edge_nginx' not in transports %}api/edge_nginx{% endif %}"
  # Showcase pruning. The bundled demo is 1,205 of a generated project's 1,433
  # Python lines against a 30-line example_feature, so declining it is the largest
  # single thing this template can do for a user who wants a skeleton rather than a
  # product tour. Everything here exists ONLY to serve that demo: the read model,
  # its REST router, its static exporter, the llms.txt renderer that reads it, its
  # tests and its guide. `src/frontend/astro` goes too, but through the
  # frontend_stack prune above — the validator on that question forbids the
  # incoherent pair rather than pruning it twice from here.
  # NOT pruned, because they do not depend on it — measured, not assumed: nothing
  # under api/rest_fastapi/aad/, mcp/, agents/ or scripts/query_corpus.py imports
  # backend.showcase. They read wiki/corpus.json, which the showcase reads too but
  # does not own, and which mcp/ and three of the four agents need.
  - "{% if not showcase %}src/backend/showcase{% endif %}"
  - "{% if not showcase %}api/rest_fastapi/showcase_api.py{% endif %}"
  - "{% if not showcase %}scripts/jobs/export_showcase_static.py{% endif %}"
  - "{% if not showcase %}scripts/jobs/build_llms_txt.py{% endif %}"
  - "{% if not showcase %}tests/unit/backend/test_showcase.py{% endif %}"
  - "{% if not showcase %}tests/integration/test_showcase_repo.py{% endif %}"
  - "{% if not showcase %}tests/integration/test_showcase_api.py{% endif %}"
  # The e2e journey walks the /api/* surface the prune above deletes, so shipping
  # it to a project that declined the showcase is two hard failures on that
  # project's first CI run. It was missed here because the decline test asserted
  # the gate through check_structure, which never executes a test; that test now
  # runs the generated project's whole suite.
  - "{% if not showcase %}tests/e2e/test_showcase_journey.py{% endif %}"
  - "{% if not showcase %}docs/guides/showcase-site.md{% endif %}"

# ---- Q&A (core facts; map 1:1 to config/project.json, enforced by check_H) -----
project_name:
  type: str
  help: "Project name (config/project.json name; also used in docs/pyproject)"
  default: "my_project"

# Computed (not asked): identifier + display forms derived from project_name so a
# free-text name ("Acme Widgets") yields a PEP 508-valid package slug ("acme_widgets")
# and a title-cased heading ("Acme Widgets"). Keel's own answer (project_keel) round-
# trips: slug -> "project_keel", title -> "Project Keel" (the self-parity anchor).
project_slug:
  type: str
  when: false
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"

project_title:
  type: str
  when: false
  default: "{{ project_name | replace('_', ' ') | replace('-', ' ') | title }}"

# Asked BEFORE frontend_stack on purpose: copier renders a question's `validator`
# with the answers gathered SO FAR, so the astro/showcase coherence check below can
# only see this answer if it is already given.
showcase:
  type: bool
  help: "Keep the bundled showcase demo (product tour: read model + /api/* + docs site)? 'no' gives a plain skeleton"
  default: true

frontend_stack:
  type: str
  help: "Frontend stack to keep (or 'none' for a backend-only project)"
  choices:
    - react-vite
    - astro
    - none
  default: react-vite
  # The astro app IS the showcase UI — all seven pages fetch /api/*, `pages.yml`
  # builds it, and `make site-static` snapshots it through the exporter that
  # `showcase=false` prunes. So this pair has no coherent meaning, and it is
  # REFUSED with the fix named rather than silently coerced to react-vite. Silent
  # coercion is the defect class the preceding passes exist to close: the user
  # would get a project that does not match the answers they gave, and find out
  # later. react-vite is unaffected — it makes no API call at all.
  validator: >-
    {% if frontend_stack == 'astro' and not showcase %}
    'astro' is the showcase UI (every page fetches /api/*), so it cannot be kept
    with showcase=false. Answer 'react-vite' or 'none' for a skeleton frontend,
    or keep the showcase.
    {% endif %}

backend_python:
  type: str
  help: "Minimum Python for the backend (must match pyproject requires-python)"
  default: ">=3.10"

toolchain_python:
  type: str
  help: "Python release CI installs (MAJOR.MINOR or MAJOR.MINOR.PATCH); it must satisfy backend_python"
  default: "3.11"
  # Asked, not computed: a computed (`when: false`) value is not recorded in the
  # answers file, and no release can be derived from a floor (">=3.12" admits
  # many). It renders config/project.json `toolchain.python`, which
  # tests/integration/test_toolchain_gate.py holds to backend_python, so the
  # validator refuses here, at generation, the pair that gate would fail later.
  # It judges each comma clause by packaging's version-specifier rules for plain
  # releases (tests/integration/test_copier_toolchain_answer.py compares the two
  # over a grid) and refuses a clause it cannot judge rather than passing it.
  validator: |-
    {%- set digits = '0123456789' -%}
    {%- set ns = namespace(release=[], bad=false, op='', spec=[], ok=true, faults=[], unjudged=[]) -%}
    {%- set given = toolchain_python.split('.') -%}
    {%- for part in given -%}
      {%- if not part or part.strip(digits) -%}{%- set ns.bad = true -%}
      {%- else -%}{%- set ns.release = ns.release + [part | int] -%}{%- endif -%}
    {%- endfor -%}
    {%- if ns.bad or given | length not in [2, 3] -%}
    toolchain_python '{{ toolchain_python }}' is not a release MAJOR.MINOR or MAJOR.MINOR.PATCH in ASCII digits, such as 3.12.
    {%- else -%}
      {%- set py = (ns.release + [0, 0, 0])[:3] -%}
      {%- for raw in backend_python.split(',') -%}
        {%- set clause = raw | replace(' ', '') | trim -%}
        {%- if clause -%}
          {%- set ns.op = '' -%}
          {%- for op in ['~=', '==', '!=', '<=', '>=', '<', '>'] -%}
            {%- if not ns.op and clause.startswith(op) -%}{%- set ns.op = op -%}{%- endif -%}
          {%- endfor -%}
          {%- set version = clause[ns.op | length:] -%}
          {%- set wild = version.endswith('.*') -%}
          {%- set parts = (version[:-2] if wild else version).split('.') -%}
          {%- set ns.spec = [] -%}
          {%- set ns.ok = ns.op != '' and parts | length <= 3 -%}
          {%- for part in parts -%}
            {%- if not part or part.strip(digits) -%}{%- set ns.ok = false -%}
            {%- else -%}{%- set ns.spec = ns.spec + [part | int] -%}{%- endif -%}
          {%- endfor -%}
          {%- if wild and ns.op not in ['==', '!='] -%}{%- set ns.ok = false -%}{%- endif -%}
          {%- if ns.op == '~=' and parts | length < 2 -%}{%- set ns.ok = false -%}{%- endif -%}
          {%- if not ns.ok -%}
            {%- set ns.unjudged = ns.unjudged + [clause] -%}
          {%- else -%}
            {%- set n = parts | length -%}
            {%- set spec = (ns.spec + [0, 0, 0])[:3] -%}
            {%- if ns.op == '>=' -%}{%- set fits = py >= spec -%}
            {%- elif ns.op == '<=' -%}{%- set fits = py <= spec -%}
            {%- elif ns.op == '>' -%}{%- set fits = py > spec -%}
            {%- elif ns.op == '<' -%}{%- set fits = py < spec -%}
            {%- elif ns.op == '~=' -%}{%- set fits = py >= spec and py[:n - 1] == spec[:n - 1] -%}
            {%- elif wild -%}{%- set fits = (py[:n] == spec[:n]) == (ns.op == '==') -%}
            {%- else -%}{%- set fits = (py == spec) == (ns.op == '==') -%}
            {%- endif -%}
            {%- if not fits -%}{%- set ns.faults = ns.faults + [clause] -%}{%- endif -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.unjudged -%}
    backend_python clause {{ ns.unjudged | join(', ') }}: the toolchain_python validator cannot judge it; write each clause as one of ~= == != <= >= < > and a release of up to three ASCII-digit parts, with a trailing .* only after == or !=.
      {%- elif ns.faults -%}
    toolchain_python {{ toolchain_python }} does not satisfy backend_python '{{ backend_python }}' (it fails {{ ns.faults | join(', ') }}); answer the release CI should install, one the floor allows.
      {%- endif -%}
    {%- endif -%}

transports:
  type: str
  multiselect: true
  help: "Optional add-on transports to keep (REST + MCP always ship — they are the transport foundation the skeleton, the AAD reference implementation and the MCP servers all run on)"
  choices:
    - grpc
    - edge_nginx
  default: []

profiles:
  type: str
  multiselect: true
  help: "Domain coding-practice profiles to enable (ai / cuda / langgraph)"
  choices:
    - ai
    - cuda
    - langgraph
  default: []

# Prunes no file: scripts/shell_gate.py ships either way and reads the answer from
# config/project.json shell.enabled, so a project that switches shell on later
# flips one key instead of re-running copier, and `_migrations` needs no mirror.
shell:
  type: bool
  help: "Gate shell scripts (lint, format and test targets that `make verify` runs)? 'no' runs no shell tool"
  default: true

# Which CI service runs the pipeline config/project.json ci_pipeline.steps
# states: each choice but `both` is a key of ci_pipeline.adapters, the file
# that service reads. Prunes the adapter not chosen, and its `_migrations`
# mirror (keep_edited_retired's `--retire`) retires it on update only when the
# project left it as keel rendered it.
ci_pipeline:
  type: str
  help: "CI service that runs the gate: 'github' (.github/workflows/ci.yml), 'gitlab' (.gitlab-ci.yml) or 'both'"
  choices:
    - github
    - gitlab
    - both
  default: github

# ---- Retirement: what `copier update` must REMOVE ----------------------------
# `_exclude` above is a GENERATION-time filter and nothing more. On update copier
# renders the OLD template copy with the UNION of the old and new excludes — on
# purpose, "to prevent deletion" (copier/_main.py) — so an excluded path is never
# retired, only never created. Re-answering `frontend_stack` therefore left the
# declined stack on disk while `.copier-answers.yml` said otherwise, and the
# project's own gate then went red through no act of its own: dangling
# CLAUDE.md -> AGENT.md symlinks plus a stack config/project.json does not declare.
#
# So every ANSWER-DRIVEN prune in `_exclude` needs a mirror here. The pair is the
# contract — `_exclude` for a project that never had the path, `_migrations` for one
# that did — and adding a prune without its mirror silently re-opens the defect,
# which is why tests/integration/test_copier_generation.py asserts the pairing
# rather than trusting this comment.
#
# THE COST, stated plainly: migrations run arbitrary commands, so copier now classes
# keel as an unsafe template and `copier update` REFUSES without `--trust`. `_tasks`
# above do the same to `copier copy`, so every documented copier command carries
# the flag (docs/adr/keel/K-0010-generation-needs-trust-to-stamp-docs.md supersedes the
# trust-free generation docs/adr/keel/K-0006-answer-retirement-via-migrations.md assumed);
# tests/integration/test_copier_generator_contract.py holds every command to it.
#
# THE RISK, stated plainly: `src/frontend/<stack>` is a real app directory that a
# project is expected to have edited, so these commands can delete work. That is the
# honest meaning of changing the answer, and it is bounded by copier's own
# preconditions: update refuses a dirty subproject and requires git, so the deleted
# tree is always recoverable with `git checkout -- <path>`. Do not extend this list
# to a path a project could have authored FROM SCRATCH, where no such history exists.
# The one exception is a CI adapter (config/project.json ci_pipeline.adapters): a
# project may write its own `.gitlab-ci.yml` or edit `ci.yml`, so keep_edited_retired
# (the first entry) removes the declined one only when it is byte-equal to what
# keel last rendered, and otherwise keeps it and says on stderr why and what to do.
#
# `_stage == 'after'` on every entry: they must see the NEW answers, which are only
# on disk in the `after` stage. The conditions re-read the answer rather than
# comparing old to new, so a project that never had the path just runs a harmless
# no-op `rm`.
_migrations:
  # Each script migration below passes `--finish-with` and copier's interpreter:
  # copier stops at the first migration that fails, so a job that refuses over
  # a conflicted file it reads (scripts/jobs/conflict_guard.py) names the
  # command that finishes the update, never a rerun of itself alone. `_tasks`
  # runs on a copy too, where there is no update to finish, so it passes none.
  #
  # FIRST on purpose: copier's `_remove_old_files` has already deleted every file
  # the old render had and the new one lacks -- edited or not (copier 9.17,
  # measured) -- before any migration runs. This job puts back each one the
  # project edited (any byte but the frontmatter `updated:` stamp) and names it on
  # stderr, so moving keel's ADRs to docs/adr/keel/ cannot silently drop a
  # project's edit (docs/adr/keel/K-0013-template-and-project-adr-number-spaces.md).
  # It must judge those deletions before the answer-driven `rm` entries below,
  # which must still win over it, and before the restamp, which stays LAST. A list,
  # so no shell; `--from` is the commit the project was generated from. copier
  # runs it for a `_commit` with no tag ancestry too: dunamai versions such a
  # commit `0.0.0.postN.devM` (project-jarvis's 72fd224, measured).
  #
  # It is also the CI adapter retirement, under the exception stated above: each
  # `--retire` names the adapter an answer declines (empty when it declines
  # none), and the job removes that file only when it is byte-equal to what keel
  # rendered at `--from` (a `.jinja` twin rendered with `--answers` read from
  # HEAD), else keeps it and says why on stderr. One run judges every file once,
  # so the file copier deleted and the file the answer retires get one verdict.
  - command: ["{{ _copier_python }}", "scripts/jobs/keep_edited_retired.py", "--quiet", "--template", "{{ _copier_conf.src_path }}", "--from", "{{ _version_from }}", "--answers", "{{ _copier_conf.answers_file }}", "--marker", "# keel-adapter: {adapter}", "--retire={% if ci_pipeline == 'gitlab' %}github:.github/workflows/ci.yml{% endif %}", "--retire={% if ci_pipeline == 'github' %}gitlab:.gitlab-ci.yml{% endif %}", "--finish-with", "{{ _copier_python }}"]
    when: "{{ _stage == 'after' }}"
  # Mirrors the frontend-stack prunes.
  - command: "rm -rf src/frontend/react-vite"
    when: "{{ _stage == 'after' and frontend_stack != 'react-vite' }}"
  - command: "rm -rf src/frontend/astro"
    when: "{{ _stage == 'after' and frontend_stack != 'astro' }}"
  - command: "rm -rf src/frontend"
    when: "{{ _stage == 'after' and frontend_stack == 'none' }}"
  # ...and the workflow that BUILDS the astro stack, whose build job would `npm ci`
  # in the directory the entry above just removed.
  - command: "rm -f .github/workflows/pages.yml"
    when: "{{ _stage == 'after' and frontend_stack != 'astro' }}"
  # Mirrors the transport prunes.
  - command: "rm -rf api/grpc"
    when: "{{ _stage == 'after' and 'grpc' not in transports }}"
  - command: "rm -f tests/unit/api/test_grpc_server.py"
    when: "{{ _stage == 'after' and 'grpc' not in transports }}"
  - command: "rm -rf api/edge_nginx"
    when: "{{ _stage == 'after' and 'edge_nginx' not in transports }}"
  # Mirrors the showcase prunes. Safe under the rule stated above — every path here
  # is keel-authored and arrives only by generation, so nothing a project could have
  # written from scratch is in reach.
  - command: "rm -rf src/backend/showcase"
    when: "{{ _stage == 'after' and not showcase }}"
  - command: "rm -f api/rest_fastapi/showcase_api.py
              scripts/jobs/export_showcase_static.py
              scripts/jobs/build_llms_txt.py
              tests/unit/backend/test_showcase.py
              tests/integration/test_showcase_repo.py
              tests/integration/test_showcase_api.py
              tests/e2e/test_showcase_journey.py
              docs/guides/showcase-site.md"
    when: "{{ _stage == 'after' and not showcase }}"
  # The generated views the showcase renders. Unlike the code above these are
  # rebuildable outputs, so leaving them would present a demo the project can no
  # longer serve — `wiki/corpus.json` is NOT here, because mcp/ and the agents read
  # it and it outlives the showcase.
  - command: "rm -f wiki/llms.txt wiki/llms-full.txt"
    when: "{{ _stage == 'after' and not showcase }}"
  # Not answer-driven, but the same defect: keel's meta-tests are pruned at
  # generation, so no CURRENT project has them — but a project generated BEFORE that
  # prune existed still carries them, and `copier update` is precisely what hands it
  # the newer `ci.yml` that installs the `template` extra and runs them. They then
  # fail on copier.yml and the `.jinja` twins, neither of which exists downstream.
  # Named exactly, not globbed, so a project's own `test_copier_*.py` is never hit.
  - command: "rm -f tests/integration/test_copier_generation.py
              tests/integration/test_copier_generator_contract.py
              tests/integration/test_copier_update.py"
    when: "{{ _stage == 'after' }}"
  # Same shape for keel's hardening plan: projects generated before that prune
  # landed still carry it, and only a migration can retire what `_exclude` can
  # merely stop shipping. Named exactly — `docs/design/` itself must survive.
  - command: "rm -f docs/design/keel-hardening-plan.md"
    when: "{{ _stage == 'after' }}"
  # Not answer-driven: `layers.app` arrived in config/project.json with a value
  # (src/app) that a project which deleted src/app, as the template's README then
  # advised, does not have, and check_H errors on it. The job acts only when the
  # path is absent AND the pre-update commit's manifest had no `layers.app`: it
  # sets it null and declares the smoke marker and the run target a project with
  # no composition root needs. A project that declared `layers.app` itself is
  # left to check_H. A list, so no shell. Before the restamp, which stays LAST.
  - command: ["{{ _copier_python }}", "scripts/jobs/declare_no_app.py", "--finish-with", "{{ _copier_python }}"]
    when: "{{ _stage == 'after' }}"
  # Resolve each conflict whose only hunk is a document's frontmatter `updated:`
  # line to the later date; every other conflict keeps copier's markers and is
  # named on stderr. An `after` migration because copier writes the markers in
  # `_apply_update`, after every `_tasks` run (so the copy-time restamp cannot
  # see them). Second to last, right BEFORE the restamp, for two measured
  # reasons: the restamp rewrites the project side of a conflicted document's
  # stamp, which on a 7f0a68b project turned a stamp-only conflict into one
  # whose two sides are identical; and the restamp refuses over a conflicted
  # file it reads (once that held check_structure.py, which it imported), and
  # copier runs no migration after one that stops. Neither job imports
  # check_structure now. A list, so no shell.
  - command: ["{{ _copier_python }}", "scripts/jobs/resolve_stamp_conflicts.py", "--quiet", "--finish-with", "{{ _copier_python }}"]
    when: "{{ _stage == 'after' }}"
  # LAST on purpose: restamp every document the update changed, after every
  # other migration has finished changing the tree. In the `after` stage the
  # project is a git work tree whose HEAD is the pre-update commit, so the
  # worklist is exactly the documents this update touched (plus any already
  # committed stale). A no-op update on a later day therefore leaves the tree
  # clean: a document neither this update nor the project changed is not in
  # the worklist, so it keeps its stamp.
  - command: ["{{ _copier_python }}", "scripts/jobs/restamp_docs.py", "--quiet", "--finish-with", "{{ _copier_python }}"]
    when: "{{ _stage == 'after' }}"
