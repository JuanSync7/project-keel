# Python src-layout. Distribution metadata for Project Keel.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project_keel"
version = "0.0.0"
description = "TODO"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx"]  # httpx backs FastAPI's TestClient (API/AAD tests)
# Optional agent-runtime engines. The default 'inprocess' runtime is pure
# stdlib (no install); install an engine only if you select it by name, e.g.
# get_runtime("langgraph"). Keeps the default install dependency-free.
langgraph = ["langgraph>=0.2"]

# src-layout: packages live under src/ (importable as their top name).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests (mirror src/)",
  "integration: 2+ real components",
  "e2e: full-system journeys",
  "smoke: liveness checks",
]

[tool.ruff]
src = ["src", "tests"]

# Practice gates that ride `make lint` into `make verify` (CONVENTIONS §6/§18).
# `extend-select` ADDS to ruff's default (E4/E7/E9, F) — it deliberately does NOT
# turn on E501/UP/RUF here: house style is %-formatting and semantic __all__
# order, so those stay deferred. See docs/guides/coding-practices.md.
[tool.ruff.lint]
extend-select = [
  "I",    # import sorting (isort) — keeps the __all__/import boundary tidy
  "B",    # bugbear: mutable defaults (B006), ABC-without-@abstractmethod (B024), raise-without-from (B904)
  "BLE",  # blind-except (BLE001) — don't swallow the exception type
  "C4",   # comprehension hygiene
  "G",    # logging: no f-string/%/+ interpolation inside log calls
  "LOG",  # logging correctness
  "RET",  # explicit, consistent returns (no bare Optional-as-silent-failure smell)
  "SIM",  # simplify (e.g. merge isinstance chains)
  "T20",  # no print() in library code
  # Slice-5 widening: families measured at ZERO current violations, so enabling
  # them is pure future-protection (no churn). Several pair with a keel practice.
  "A",    # don't shadow a builtin (name hygiene)
  "FA",   # future-annotations hygiene
  "FURB", # refurb: modernise dead idioms
  "ICN",  # import conventions (e.g. `import numpy as np`)
  "ISC",  # implicit string-concatenation bugs
  "PERF", # perflint: performance anti-patterns
  "PGH",  # pragma hygiene — no blanket `# noqa` / `# type: ignore` (pairs with practice-ok)
  "PIE",  # misc anti-patterns (unnecessary pass, dupe dict keys)
  "RSE",  # no redundant parentheses on `raise`
  "SLOT", # __slots__ on str/tuple/NamedTuple subclasses (pairs with slots-hot-path)
  "NPY",  # numpy legacy API (relevant to the tensor/cuda domain)
]

[tool.ruff.lint.per-file-ignores]
"src/app/**" = ["T201"]        # entrypoints may print; library code may not

# Slice-5 widening: the strict backlog was 3 `no-untyped-def` sites (now fixed),
# so mypy goes full-strict — every function typed, no untyped calls/decorators,
# no Any-return, no implicit re-export, redundant-cast + unreachable warnings.
# check_structure.py check_M proves this can't silently drift from the declared
# policy in config/practices.json rulesets.mypy.
[tool.mypy]
files = ["src"]
strict = true                  # the whole strict set (implies no_implicit_optional, disallow_any_generics, warn_return_any, warn_unused_ignores, disallow_untyped_defs, ...)
warn_unreachable = true        # not in --strict: flag code mypy proves can never run
