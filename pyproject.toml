# Python src-layout. Distribution metadata for Project Keel.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project_keel"
version = "0.0.0"
description = "TODO"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# httpx backs FastAPI's TestClient (API/AAD tests); jsonschema validates the served
# AAD descriptor against the committed schema — it was in no extra at all, so that
# assertion had never executed anywhere while the suite reported success.
# ruff and mypy are pinned EXACTLY, unlike the rest: their output is not a
# dependency of the gate, it IS the gate's verdict. Unpinned, CI resolved ruff
# 0.16.4 against the venv's 0.15.18 — and because `extend-select` ADDS to ruff's
# defaults, 0.16's wider default set reported 464 findings from families this repo
# deliberately defers (UP031, E402, RUF100). Same tree, green locally and red in
# CI, with no commit in between. Bump these on purpose, in their own commit, with
# the corpus re-linted at the new version — and move .pre-commit-config.yaml's rev
# in the same change (tests/integration/test_gate_scope.py pins the two together).
dev = [
  "pytest",
  "pytest-cov",
  "ruff==0.15.18",
  "mypy==2.1.0",
  "httpx",
  "jsonschema",
]
# Optional agent-runtime engines. The default 'inprocess' runtime is pure
# stdlib (no install); install an engine only if you select it by name, e.g.
# get_runtime("langgraph"). Keeps the default install dependency-free.
langgraph = ["langgraph>=0.2"]
# Optional project generator. Keel's repo root is a `copier` template; install this
# only to generate or refresh a downstream project (`make new` / `copier copy` /
# `copier update`). The default install + CI/pre-commit stay dependency-free.
# `>=9.3` mirrors copier.yml `_min_copier_version` — the new-format `_migrations`
# this template uses are a KeyError on anything older (see that file for the measurement).
template = ["copier>=9.3"]

# src-layout: packages live under src/ (importable as their top name).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests (mirror src/)",
  "integration: 2+ real components",
  "e2e: full-system journeys",
  "smoke: liveness checks",
]

[tool.ruff]
src = ["src", "tests"]

# Practice gates that ride `make lint` into `make verify` (CONVENTIONS §6/§18).
# `extend-select` ADDS to ruff's default (E4/E7/E9, F) — it deliberately does NOT
# turn on E501/UP/RUF here: house style is %-formatting and semantic __all__
# order, so those stay deferred. See docs/guides/coding-practices.md.
[tool.ruff.lint]
extend-select = [
  "I",    # import sorting (isort) — keeps the __all__/import boundary tidy
  "B",    # bugbear: mutable defaults (B006), ABC-without-@abstractmethod (B024), raise-without-from (B904)
  "BLE",  # blind-except (BLE001) — don't swallow the exception type
  "C4",   # comprehension hygiene
  "G",    # logging: no f-string/%/+ interpolation inside log calls
  "LOG",  # logging correctness
  "RET",  # explicit, consistent returns (no bare Optional-as-silent-failure smell)
  "SIM",  # simplify (e.g. merge isinstance chains)
  "T20",  # no print() in library code
  # Slice-5 widening: families measured at ZERO current violations, so enabling
  # them is pure future-protection (no churn). Several pair with a keel practice.
  "A",    # don't shadow a builtin (name hygiene)
  "FA",   # future-annotations hygiene
  "FURB", # refurb: modernise dead idioms
  "ICN",  # import conventions (e.g. `import numpy as np`)
  "ISC",  # implicit string-concatenation bugs
  "PERF", # perflint: performance anti-patterns
  "PGH",  # pragma hygiene — no blanket `# noqa` / `# type: ignore` (pairs with practice-ok)
  "PIE",  # misc anti-patterns (unnecessary pass, dupe dict keys)
  "RSE",  # no redundant parentheses on `raise`
  "SLOT", # __slots__ on str/tuple/NamedTuple subclasses (pairs with slots-hot-path)
  "NPY",  # numpy legacy API (relevant to the tensor/cuda domain)
]

[tool.ruff.lint.per-file-ignores]
"src/app/**" = ["T201"]        # entrypoints may print; library code may not
# Pass 3 widened the lint scope to every CODE_ROOT, which surfaced 41 T201 sites.
# All of them are process entrypoints writing to stdout, i.e. the same carve-out
# `src/app/**` already has — not library logging. Named file-by-file where the root
# holds library code too, so a genuine library print() there is still caught; only
# scripts/ takes a glob, and only because every one of its print() calls is inside a
# `main()` (measured) and nothing in src/ imports it. Mirrored as DATA in
# config/practices.json rulesets.ruff.per_file_ignores.
"scripts/**" = ["T201"]                            # CLI checks/jobs; all prints are in main()
"api/grpc/server.py" = ["T201"]                    # serve() bind banner under __main__
"api/rest_fastapi/export_openapi.py" = ["T201"]    # --check/--write CLI result lines
"demo/run_demo.py" = ["T201"]                      # the demo IS stdout

# Slice-5 widening: the strict backlog was 3 `no-untyped-def` sites (now fixed),
# so mypy goes full-strict — every function typed, no untyped calls/decorators,
# no Any-return, no implicit re-export, redundant-cast + unreachable warnings.
# check_structure.py check_M proves this can't silently drift from the declared
# policy in config/practices.json rulesets.mypy.
#
# SCOPE (pass 3): `files = ["src"]` left 8 of the 9 CODE_ROOTS unchecked — 1272 strict
# errors were hiding there. Full strict over all of them is not one jump, so the scope
# is a RATCHET: a root is added here only once it is measured clean under a named
# override, and every root NOT yet here is declared, with its cost and its exit
# condition, in config/practices.json rulesets.mypy.ratchet.
# tests/integration/test_gate_scope.py fails if a code root is in neither place, so a
# root can never again be silently unmentioned.
[tool.mypy]
files = ["src", "models", "demo", "agents"]
# Prerequisites for any root beyond src/: agents/ has no __init__.py while its children
# do, so mypy dies with "Source file found twice under different module names" without
# explicit_package_bases; and the sibling modules injected via sys.path (backend, ...)
# are unresolvable without mypy_path. Only "src" is listed: adding api/rest_fastapi
# would make its app.py a top-level `app` and collide with src/app/.
explicit_package_bases = true
mypy_path = ["src"]
strict = true                  # the whole strict set (implies no_implicit_optional, disallow_any_generics, warn_return_any, warn_unused_ignores, disallow_untyped_defs, ...)
warn_unreachable = true        # not in --strict: flag code mypy proves can never run

# --- ratchet rung 1: the leaf roots enter the gate with named, minimal relaxations ---
# Each block below relaxes ONLY the flags measured to be needed for that root, never
# `strict = false`. (`runtimes.*` below is the one `ignore_errors`, and it is declared
# as such.) Deleting a line is the ratchet step; the annotations it demands are the
# work. Every relaxation here is MIRRORED in config/practices.json
# rulesets.mypy.overrides and enforced by check_M: an undeclared per-module relaxation
# — including switching off a COMPONENT of strict rather than strict itself — is an
# error. Change one file and the gate fails until you change the other.

[[tool.mypy.overrides]]
# models/: pluggable model backends. `typed-everywhere` relaxed (5 untyped defs) and
# `return-any` relaxed (3 sites returning a dynamically-imported backend).
# Removed when: those 8 functions are annotated and the 3 dynamic returns are narrowed
# with an explicit cast at the boundary (NOT `# type: ignore` — PGH003 forbids it).
module = ["models.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false   # 2 bare dict/list annotations
warn_return_any = false         # 3 no-any-return

[[tool.mypy.overrides]]
# demo/: the AAD reference agent. `typed-everywhere` + 2 bare generics; the reference
# agent imports its FastAPI app by path, which mypy cannot resolve from the repo root.
# Removed when: the two bare `dict` annotations are parameterised and the demo app's
# import is made resolvable (it is the same sys.path-injection as api/rest_fastapi).
module = ["demo.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# `aad` is demo/aad_reference_agent/aad/, imported after a sys.path.insert so it is
# only resolvable at runtime. Keyed on the IMPORTED name (an ignore_missing_imports on
# `demo.*` would not apply — the setting is read off the module being imported).
# Removed when: the reference agent is importable by its package path instead of via
# sys.path injection (same structural fix api/rest_fastapi needs).
module = ["aad", "aad.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# runtimes/ is NOT in `files`; it is declared pending in
# config/practices.json rulesets.mypy.ratchet (87 errors). It is dragged in anyway
# because agents/ imports it, so without this every agents/ run would report a
# backlog nobody is committed to this pass. Scoped to this one root, alongside a
# declared cost and exit condition — not a blanket suppression.
# Removed when: runtimes enters `files` (its rung is the engine annotations plus
# parameterising the step-state dicts in runtimes/contracts.py).
module = ["runtimes.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# agents/: the doers. `typed-everywhere` relaxed plus 8 bare dict/list annotations —
# the step contract is `Callable[[dict], Optional[dict]]`, so parameterising it is a
# contract change in runtimes/contracts.py, not a local edit.
# Removed when: runtimes/contracts.py declares the step state/update element types and
# the three _brain.py modules are annotated against it.
module = ["agents.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
