# Install once:  pip install -e ".[dev]" (it carries pre-commit) && pre-commit install
# The secret scanner once per machine:  make secrets-install
# Each hook below is a thin TRIGGER (an adapter) that fires a doer;
# the doer's logic lives in scripts/ or the tool, never inline here.
repos:
  - repo: local
    hooks:
      - id: structure
        name: structure & frontmatter conventions
        entry: python3 scripts/check_structure.py
        language: system
        pass_filenames: false
        always_run: true
      - id: eslint
        name: eslint (frontend)
        entry: make lint-fe
        language: system
        pass_filenames: false
        files: \.(ts|tsx|js|jsx|astro)$
      - id: cdmon
        name: cdmon code-doc drift (no-op if cdmon not installed)
        entry: python3 scripts/cdmon_sync.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: aad-schema
        name: AAD schema in sync with the model (skips if pydantic absent)
        entry: python3 scripts/agent_surface/generate_aad_schema.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: openapi
        name: openapi.json in sync with the app (skips if FastAPI absent)
        entry: python3 api/rest_fastapi/export_openapi.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: doc-review
        name: doc review (stale stamps fail; unresolved mentions are advisory; no git is a stated skip)
        entry: python3 scripts/jobs/review_docs.py --strict
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must equal the `ruff==` pin in pyproject.toml's `dev` extra: a hook that
    # runs a different ruff than the gate reports the gate's output as a defect.
    rev: v0.15.18
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    # Must equal config/project.json secrets.scanner.rev (and this repo its
    # hook_repo): scripts/scan_secrets.py records this build under that rev and
    # the history scan refuses a record naming another.
    rev: v8.30.1
    hooks:
      # Every commit runs this one over the index git hands the hook: a
      # credential-shaped value in what the commit adds is refused, printed as
      # file, line and rule, never the value. No always_run: pre-commit skips
      # it when a commit adds or changes no file. `pre-commit run --all-files`
      # runs it with nothing staged, and then it scans every commit instead,
      # so it never passes, or fails, over zero files.
      - id: gitleaks
        name: secret scan (staged, or every commit when nothing is staged)
        entry: python3 scripts/scan_secrets.py --staged-or-history
        pass_filenames: false
      # `make secrets-install` runs this one: pre-commit builds the pinned
      # scanner into its cache, and the entry records where. Manual, so no
      # commit runs it.
      - id: gitleaks
        alias: secrets-locate
        name: secret scanner (record the pinned build)
        entry: python3 scripts/scan_secrets.py --locate
        pass_filenames: false
        always_run: true
        stages: [manual]
