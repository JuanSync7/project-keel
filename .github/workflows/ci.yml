name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history + tags: copier resolves a template by git ref, and the
        # default depth-1 checkout carries NO tags — so a `--vcs-ref v0.1.0` pin or
        # any multi-commit update test would fail in CI only.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      # The `template` extra (copier) is REQUIRED here, not optional: keel's repo root
      # IS the template, and without copier every tests/integration/test_copier_*.py
      # importorskips — so the generation and update gates never ran in CI at all.
      - run: pip install -e ".[dev,template]"
      # Optional transport deps so the API + AAD tests actually run (not skip):
      # the showcase REST/AAD tests need FastAPI + pydantic, which live in the
      # transport's own requirements, not in the dependency-free base install.
      # (The langgraph engine stays optional — its conformance test importorskips.)
      - run: pip install -r api/rest_fastapi/requirements.txt
      # Install FE deps so the frontend lint/typecheck gates run; no-op
      # if there are no frontend apps.
      - run: make fe-install
      - run: make check-all   # structure, corpus, openapi, aad, cdmon (a stated skip)
      - run: make lint
      - run: make typecheck
      # The corpus (wiki/corpus.json) is a generated artifact (gitignored), so a
      # fresh checkout doesn't have it; the showcase integration tests read it.
      # Build it before the suite runs.
      - run: make site-data
      # Declare the surfaces installed above REQUIRED: a missing import is then a hard
      # collection error here instead of a silent skip that leaves whole gates
      # unexecuted while the run stays green. A bare local clone leaves this unset and
      # still skips gracefully. The vocabulary (and what installs each) is
      # tests/optional_deps.py SURFACES; an unknown name here is an error, not a no-op.
      - run: make test
        env:
          KEEL_REQUIRED_EXTRAS: "template,dev,transport"
