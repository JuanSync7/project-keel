name: ci
on: [push, pull_request]
jobs:
  test:
    # A named image, not ubuntu-latest: the machine the gate runs on changes
    # only when this line is edited.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # Full history + tags: copier resolves a template by git ref, and the
        # default depth-1 checkout carries NO tags — so a `--vcs-ref v0.1.0` pin or
        # any multi-commit update test would fail in CI only.
        with: { fetch-depth: 0 }
      # The versions come from config/project.json `toolchain`, one home each,
      # printed by the checker into this step's outputs; the runner's own python3
      # runs it, because it is stdlib-only and 3.6-safe.
      - id: toolchain
        run: python3 scripts/check_toolchain.py versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with: { python-version: "${{ steps.toolchain.outputs.python }}" }
      - uses: actions/setup-node@v6
        with: { node-version: "${{ steps.toolchain.outputs.node }}" }
      # The `template` extra (copier) is REQUIRED here, not optional: keel's repo root
      # IS the template, and without copier every tests/integration/test_copier_*.py
      # importorskips — so the generation and update gates never ran in CI at all.
      # `dev` names the `transport` extra, so the same line installs FastAPI,
      # uvicorn and pydantic for the REST and AAD tests; the dependency-free base
      # install stays as it is. (The langgraph engine stays optional — its
      # conformance test importorskips.)
      - run: pip install -e ".[dev,template]"
      # The secret scanner: pre-commit builds the build .pre-commit-config.yaml
      # pins and records where (scripts/scan_secrets.py --locate), then the
      # history scan judges every commit the full checkout above carries. Both
      # run before the suite, so a committed credential fails the job even when
      # the push skipped the staged hook with --no-verify.
      - run: make secrets-install
      - run: make secret-scan
      # Install FE deps so the frontend lint/typecheck gates and suites run; no-op
      # if there are no frontend apps.
      - run: make fe-install
      - run: make check-all   # venv, structure, python floor, corpus, openapi, aad, cdmon (a stated skip)
      - run: make lint
      - run: make typecheck
      # The corpus (wiki/corpus.json) is a generated artifact (gitignored), so a
      # fresh checkout doesn't have it; the showcase integration tests read it.
      # Build it before the suite runs.
      - run: make site-data
      # Declare the surfaces installed above REQUIRED: a missing import is then a hard
      # collection error here instead of a silent skip that leaves whole gates
      # unexecuted while the run stays green. A bare local clone leaves this unset and
      # still skips gracefully. The vocabulary (and what installs each) is
      # tests/optional_deps.py SURFACES; an unknown name here is an error, not a no-op.
      - run: make test
        env:
          KEEL_REQUIRED_EXTRAS: "template,dev,transport,secrets"
      # Judges every requirement in the specs against the tests that name it and
      # the documented gaps (config/project.json traceability;
      # scripts/trace_requirements.py).
      - run: make trace
      # Replays every eval suite against its recorded responses: no network, no
      # credential (config/project.json evals; scripts/run_evals.py).
      - run: make eval
      # The browser journey needs a browser in the runner's per-user cache, which
      # a fresh CI machine does not have and `make fe-install` does not fill.
      # Download it here (with its system libraries) rather than skip the journey:
      # `make test-fe` refuses, exit 2, on an app it cannot run, so a missing
      # browser or install fails this job instead of passing over nothing.
      - name: download the browser the frontend journey drives
        run: make fe-browsers FE_BROWSER_FLAGS=--with-deps
      - run: make test-fe
      # The shell tests (scripts/shell_gate.py test). `make lint` above already
      # ran the shell linter and the format check.
      - run: make test-sh
